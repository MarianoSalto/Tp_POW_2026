<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnero Aleatorio</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cssBoostrap/bootstrap.min.css">
</head>
<body>
    <header>
        <h1>Turnero Aleatorio</h1>
    </header>

    <div class="bloque">
        <form action="">
            <div class="titulo_inputs">
                <h5>Generador de nùmeros</h5>
            </div>
            <div class="inputsBloques">
                <div class="inputBloque">
                    <label for="minimo">Min:  </label>
                    <input type="number" id="minimo" class="minimo">
                </div>
                <div class="inputBloque">
                    <label for="maximo">Màx: </label>
                    <input type="number" id="maximo" class="maximo">
                </div>
            </div>
            <div class="botones">
                <button type="submit" class="btn btn-primary generar"> Generar </button>
                <button type="submit" class="btn btn-secondary reiniciar"> Reiniciar </button>
            </div>
        </form>
        <div class="bloqueGenerado">
            <p class="nroGenerado"></p>
        </div>
    </div>
</body>

<script src="js/app.js"></script>
</html>
